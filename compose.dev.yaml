services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file: .env.dev
    environment:
      VITE_API_PROXY_TARGET: http://backend:8080
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.dev
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      APP_S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
      REDIS_HOST: redis
      APP_STOMP_RELAY_HOST: rabbitmq
      GOOGLE_CLIENT_ID: local-google-client-id
      GOOGLE_CLIENT_SECRET: local-google-client-secret
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 20s
      timeout: 5s
      start_period: 90s
      retries: 5
    restart: unless-stopped

  backend-replica:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env.dev
    profiles: ["multi-instance"]
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      APP_S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_USERNAME: ""
      SMTP_PASSWORD: ""
      SMTP_AUTH: "false"
      SMTP_STARTTLS: "false"
      GOOGLE_CLIENT_ID: local-google-client-id
      GOOGLE_CLIENT_SECRET: local-google-client-secret
      REDIS_HOST: redis
      APP_STOMP_RELAY_HOST: rabbitmq
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 20s
      timeout: 5s
      start_period: 90s
      retries: 5
    restart: unless-stopped

  frontend-replica:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file: .env.dev
    profiles: ["multi-instance"]
    environment:
      VITE_API_PROXY_TARGET: http://backend-replica:8080
    ports:
      - "127.0.0.1:5174:5173"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      backend-replica:
        condition: service_healthy
    restart: unless-stopped

  chess-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    env_file: .env.dev
    environment:
      CHESS_HOST: 0.0.0.0
      CHESS_PORT: 9002
      CHESS_JWT_SECRET: ${APP_ENGINE_JWT_SECRET:?APP_ENGINE_JWT_SECRET is required in .env.dev}
      SPRING_WEBHOOK_URL: http://backend:8080/api/internal/games/record
      INTERNAL_WEBHOOK_SECRET: ${APP_INTERNAL_TOKEN:?APP_INTERNAL_TOKEN is required in .env.dev}
      CHESS_OUTBOX_DIR: /var/lib/chess/outbox
    ports:
      - "127.0.0.1:9002:9002"
    volumes:
      - chess-outbox:/var/lib/chess/outbox
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME is required in .env.dev}
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required in .env.dev}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env.dev}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${APP_S3_ACCESS_KEY:?APP_S3_ACCESS_KEY is required in .env.dev}
      MINIO_ROOT_PASSWORD: ${APP_S3_SECRET_KEY:?APP_S3_SECRET_KEY is required in .env.dev}
    ports:
      - "127.0.0.1:9003:9000"
      - "127.0.0.1:9004:9001"
    volumes:
      - dev-minio:/data
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.22
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$APP_REDIS_SECRET\""]
    env_file: .env.dev
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - dev-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$APP_REDIS_SECRET\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_stomp && exec rabbitmq-server"]
    env_file: .env.dev
    environment:
      RABBITMQ_DEFAULT_USER: ${APP_STOMP_RELAY_LOGIN:-chess}
      RABBITMQ_DEFAULT_PASS: ${APP_STOMP_RELAY_PASSCODE:-chess-local-rabbit-password}
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_listener 61613"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  chess-outbox:
  dev-minio:
  dev-postgres:
  frontend-node-modules:
  dev-redis:
