x-redis-credentials: &redis-credentials
  APP_REDIS_SECRET: ${APP_REDIS_SECRET:?Set the Redis credential in .env.deploy}

services:
  edge:
    image: caddy:2.10-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env.deploy}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - frontend
      - backend
      - chess-server
    restart: unless-stopped

  ngrok:
    image: ngrok/ngrok:latest
    command: ["http", "--url", "https://${APP_DOMAIN:?Set APP_DOMAIN in .env.deploy}", "edge:80"]
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?Set NGROK_AUTHTOKEN in .env.deploy}
    depends_on:
      - edge
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:?Set DB_NAME in .env.deploy}
      DB_USERNAME: ${DB_USERNAME:?Set DB_USERNAME in .env.deploy}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.deploy}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_POOL_MIN_IDLE: ${DB_POOL_MIN_IDLE:-2}
      APP_FRONTEND_URL: https://${APP_DOMAIN:?Set APP_DOMAIN in .env.deploy}
      APP_ENGINE_WS_URL: wss://${APP_DOMAIN:?Set APP_DOMAIN in .env.deploy}/engine/ws/play
      APP_CORS_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN in .env.deploy}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?Set APP_JWT_SECRET in .env.deploy}
      APP_ENGINE_JWT_SECRET: ${APP_ENGINE_JWT_SECRET:?Set APP_ENGINE_JWT_SECRET in .env.deploy}
      APP_INTERNAL_TOKEN: ${APP_INTERNAL_TOKEN:?Set APP_INTERNAL_TOKEN in .env.deploy}
      REDIS_HOST: redis
      <<: *redis-credentials
      APP_STOMP_RELAY_HOST: rabbitmq
      APP_STOMP_RELAY_LOGIN: ${APP_STOMP_RELAY_LOGIN:?Set APP_STOMP_RELAY_LOGIN in .env.deploy}
      APP_STOMP_RELAY_PASSCODE: ${APP_STOMP_RELAY_PASSCODE:?Set APP_STOMP_RELAY_PASSCODE in .env.deploy}
      APP_ACCESS_TOKEN_TTL: ${APP_ACCESS_TOKEN_TTL:-PT15M}
      APP_REFRESH_TOKEN_TTL: ${APP_REFRESH_TOKEN_TTL:-P7D}
      APP_ROOM_TOKEN_TTL: ${APP_ROOM_TOKEN_TTL:-PT2M}
      APP_GAME_START_TIMEOUT: ${APP_GAME_START_TIMEOUT:-PT2M}
      APP_INVITATION_TTL: ${APP_INVITATION_TTL:-PT5M}
      COOKIE_SECURE: "true"
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-Strict}
      APP_EMAIL_FROM: ${APP_EMAIL_FROM:?Set APP_EMAIL_FROM in .env.deploy}
      APP_STORAGE_PROVIDER: s3
      APP_S3_ENDPOINT: ${APP_S3_ENDPOINT:-http://minio:9000}
      APP_S3_REGION: ${APP_S3_REGION:?Set APP_S3_REGION in .env.deploy}
      APP_S3_BUCKET: ${APP_S3_BUCKET:?Set APP_S3_BUCKET in .env.deploy}
      APP_S3_ACCESS_KEY: ${APP_S3_ACCESS_KEY:?Set APP_S3_ACCESS_KEY in .env.deploy}
      APP_S3_SECRET_KEY: ${APP_S3_SECRET_KEY:?Set APP_S3_SECRET_KEY in .env.deploy}
      APP_S3_PATH_STYLE: ${APP_S3_PATH_STYLE:-true}
      APP_AVATAR_MAX_SIZE: ${APP_AVATAR_MAX_SIZE:-5MB}
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env.deploy}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?Set SMTP_USERNAME in .env.deploy}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?Set SMTP_PASSWORD in .env.deploy}
      SMTP_AUTH: ${SMTP_AUTH:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?Set Google OAuth credentials in .env.deploy}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?Set Google OAuth credentials in .env.deploy}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=60.0}
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 20s
      timeout: 5s
      start_period: 90s
      retries: 5
    restart: unless-stopped

  chess-server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      CHESS_HOST: 0.0.0.0
      CHESS_PORT: "9002"
      CHESS_JWT_SECRET: ${APP_ENGINE_JWT_SECRET:?Set APP_ENGINE_JWT_SECRET in .env.deploy}
      SPRING_WEBHOOK_URL: http://backend:8080/api/internal/games/record
      INTERNAL_WEBHOOK_SECRET: ${APP_INTERNAL_TOKEN:?Set APP_INTERNAL_TOKEN in .env.deploy}
      CHESS_OUTBOX_DIR: /var/lib/chess/outbox
      CHESS_DISCONNECT_GRACE_SECONDS: ${CHESS_DISCONNECT_GRACE_SECONDS:-60}
      CHESS_ROOM_START_TIMEOUT_SECONDS: ${CHESS_ROOM_START_TIMEOUT_SECONDS:-120}
    expose:
      - "9002"
    volumes:
      - chess-outbox:/var/lib/chess/outbox
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:?Set DB_NAME in .env.deploy}
      POSTGRES_USER: ${DB_USERNAME:?Set DB_USERNAME in .env.deploy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.deploy}
    volumes:
      - deploy-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  minio:
    image: cgr.dev/chainguard/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${APP_S3_ACCESS_KEY:?Set APP_S3_ACCESS_KEY in .env.deploy}
      MINIO_ROOT_PASSWORD: ${APP_S3_SECRET_KEY:?Set APP_S3_SECRET_KEY in .env.deploy}
    expose:
      - "9000"
    volumes:
      - deploy-minio:/data
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$APP_REDIS_SECRET\""]
    environment:
      <<: *redis-credentials
    expose:
      - "6379"
    volumes:
      - deploy-redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$APP_REDIS_SECRET\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    command: ["sh", "-c", "rabbitmq-plugins enable --offline rabbitmq_stomp && exec rabbitmq-server"]
    environment:
      RABBITMQ_DEFAULT_USER: ${APP_STOMP_RELAY_LOGIN:?Set APP_STOMP_RELAY_LOGIN in .env.deploy}
      RABBITMQ_DEFAULT_PASS: ${APP_STOMP_RELAY_PASSCODE:?Set APP_STOMP_RELAY_PASSCODE in .env.deploy}
    expose:
      - "61613"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q check_port_listener 61613"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  chess-outbox:
  deploy-minio:
  deploy-postgres:
  deploy-redis:
