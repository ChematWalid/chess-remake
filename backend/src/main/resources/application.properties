spring.application.name=chess-backend
server.port=${SERVER_PORT:8080}
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:chess}
spring.datasource.username=${DB_USERNAME:chess}
spring.datasource.password=${DB_PASSWORD:change-me}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.servlet.multipart.max-file-size=${APP_AVATAR_MAX_SIZE:5MB}
spring.servlet.multipart.max-request-size=${APP_AVATAR_MAX_SIZE:5MB}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:false}

app.frontend-url=${APP_FRONTEND_URL:http://localhost:5173}
app.engine-ws-url=${APP_ENGINE_WS_URL:ws://localhost:9002/ws/play}
app.cors-origins=${APP_CORS_ORIGINS:http://localhost:5173}
app.jwt-secret=${APP_JWT_SECRET:}
app.engine-jwt-secret=${APP_ENGINE_JWT_SECRET:}
app.internal-token=${APP_INTERNAL_TOKEN:}
app.access-token-ttl=${APP_ACCESS_TOKEN_TTL:PT15M}
app.refresh-token-ttl=${APP_REFRESH_TOKEN_TTL:P7D}
app.room-token-ttl=${APP_ROOM_TOKEN_TTL:PT2M}
app.game-start-timeout=${APP_GAME_START_TIMEOUT:PT2M}
app.invitation-ttl=${APP_INVITATION_TTL:PT5M}
app.cookie-secure=${COOKIE_SECURE:false}
app.cookie-same-site=${COOKIE_SAME_SITE:Strict}
app.email-from=${APP_EMAIL_FROM:chess@localhost}
app.storage-provider=${APP_STORAGE_PROVIDER:s3}
app.s3-endpoint=${APP_S3_ENDPOINT:http://localhost:9000}
app.s3-region=${APP_S3_REGION:us-east-1}
app.s3-bucket=${APP_S3_BUCKET:chess-files}
app.s3-access-key=${APP_S3_ACCESS_KEY:chess-local}
app.s3-secret-key=${APP_S3_SECRET_KEY:change-me-minio}
app.s3-path-style=${APP_S3_PATH_STYLE:true}
app.avatar-max-size=${APP_AVATAR_MAX_SIZE:5MB}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized
management.info.env.enabled=false
logging.level.root=${LOG_LEVEL:INFO}
logging.level.com.chess.backend=${LOG_LEVEL:INFO}
