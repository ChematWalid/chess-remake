services:
  backend:
    build: .
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      APP_S3_ENDPOINT: http://minio:9000
      SMTP_HOST: mailpit
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    restart: unless-stopped
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-chess}
      POSTGRES_USER: ${DB_USERNAME:-chess}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-me}
    ports:
      - "5434:5432"
    volumes:
      - chess-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-chess} -d ${DB_NAME:-chess}"]
      interval: 5s
      timeout: 3s
      retries: 20
  minio:
    image: cgr.dev/chainguard/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${APP_S3_ACCESS_KEY:-chess-local}
      MINIO_ROOT_PASSWORD: ${APP_S3_SECRET_KEY:-change-me-minio}
    ports:
      - "9003:9000"
      - "9004:9001"
    volumes:
      - chess-minio:/data
  mailpit:
    image: axllent/mailpit:v1.22
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  chess-postgres:
  chess-minio:
